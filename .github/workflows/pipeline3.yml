name: Pipeline com Docker

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build e Push da Imagem
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Login necessário para enviar a imagem ao Docker Hub
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # Cria e envia a imagem Docker
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USER }}/pipeline-ci:latest

  test:
    name: Testes
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # Executa os testes dentro do container
      - name: Rodar testes dentro do Container
        run: docker run --rm ${{ secrets.DOCKER_USER }}/pipeline-ci:latest pytest

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy realizado
        run: echo "Deploy realizado"
