name: Pipeline com Docker

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build da Imagem
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t meu-projeto-fatec:latest .

      - name: Salvar imagem para os próximos jobs
        run: docker save meu-projeto-fatec:latest -o imagem.tar

      - name: Enviar imagem como artefato
        uses: actions/upload-artifact@v4
        with:
          name: imagem-docker
          path: imagem.tar

  test:
    name: Testar Container
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar imagem salva
        uses: actions/download-artifact@v4
        with:
          name: imagem-docker

      - name: Carregar imagem Docker
        run: docker load -i imagem.tar

      - name: Executar testes
        run: docker run --rm meu-projeto-fatec:latest pytest

  push:
    name: Enviar para Docker Hub
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar imagem salva
        uses: actions/download-artifact@v4
        with:
          name: imagem-docker

      - name: Carregar imagem Docker
        run: docker load -i imagem.tar

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Criar tag da imagem
        run: |
          docker tag meu-projeto-fatec:latest \
            ${{ secrets.DOCKER_USER }}/meu-projeto-fatec:v1

      - name: Enviar imagem
        run: docker push ${{ secrets.DOCKER_USER }}/meu-projeto-fatec:v1

  deploy:
    name: Deploy
    needs: push
    runs-on: ubuntu-latest

    steps:
      - name: Executar deploy
        run: echo "Imagem enviada! Pronta para deploy no servidor."