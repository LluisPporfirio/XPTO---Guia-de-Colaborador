name: Pipeline com Docker

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # O Login é necessário para enviar a imagem para o Docker Hub
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # Aqui o Docker constrói e envia a imagem
      # - name: Build e Push da Imagem
      #   uses: docker/build-push-action@v5
      #   with:
      #    context: .
      #    push: true
      #    tags: ${{ secrets.DOCKER_USER }}/pipeline-ci:latest

      - name: Build com Docker Compose
        run: docker compose build

      - name: Push com Docker Compose
        run: docker compose push
  test:
    name: Testar Container
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Executar testes
        run: |
          docker run -d --name teste -p 3000:3000 ${{ secrets.DOCKER_USER }}/pipeline-ci:latest
          sleep 2
          curl --fail http://localhost:3000/index.txt
          docker stop teste

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Executar deploy
        run: echo "Imagem enviada! Pronta para deploy no servidor."