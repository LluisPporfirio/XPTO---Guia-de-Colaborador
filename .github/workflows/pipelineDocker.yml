name: Pipeline com Docker

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Login necessário para enviar a imagem ao Docker Hub
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # Constrói e envia a imagem Python
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USER }}/meu-projeto-fatec:latest

  test:
    name: Testar Container
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Executar testes
        run: docker run --rm ${{ secrets.DOCKER_USER }}/meu-projeto-fatec:latest pytest

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Executar deploy
        run: echo "Imagem enviada! Testes aprovados, pronta para deploy no servidor."